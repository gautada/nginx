# # ---- WebDAV only at /webdav ----
# # Use 'alias' (NOT 'root') so /webdav/<path> maps to /mnt/volumes/data/<path>
# location /webdav/ {
#   alias /mnt/volumes/data/;         # NOTE: trailing slashes on both sides
#   autoindex on;                      # optional: directory listing in browsers
#   add_header DAV "1,2" always;       # hint DAV capabilities
#
#   # Core DAV (writes)
#   dav_methods       PUT DELETE MKCOL COPY MOVE;
#   create_full_put_path on;
#   dav_access        user:rw group:r all:r;
#
#   # Extra DAV for GUI clients (Finder, Cyberduck, etc.)
#   dav_ext_methods   PROPFIND OPTIONS LOCK UNLOCK;
#   dav_ext_lock_zone zone=davlocks:10m;
#
#   # (optional) tighten: limit_upload_rate / client_body_buffer_size, etc.
# }
# # ---------------------------------
# location ^~ /webdav/ {
#   alias /mnt/volumes/data/;          # trailing slash matters
#   autoindex on;
#   add_header DAV "1,2" always;
#
#   # Core DAV
#   dav_methods         PUT DELETE MKCOL COPY MOVE;
#   create_full_put_path on;
#   dav_access          user:rw group:r all:r;
#
#   # Extra DAV (adds OPTIONS/PROPFIND/LOCK/UNLOCK)
#   dav_ext_methods     PROPFIND OPTIONS LOCK UNLOCK;
#   dav_ext_lock_zone   zone=davlocks:10m;
# }
location ^~ /webdav/ {
  alias /mnt/volumes/data/;
  autoindex on;
  add_header DAV "1,2" always;

  # Handle CORS preflights or generic OPTIONS
  if ($request_method = OPTIONS) {
    add_header Allow 'OPTIONS, PROPFIND, GET, HEAD, PUT, DELETE, MKCOL, COPY, MOVE' always;
    return 204;
  }

  dav_methods         PUT DELETE MKCOL COPY MOVE;
  create_full_put_path on;
  dav_access          user:rw group:r all:r;
}

