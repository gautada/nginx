# Exact "/" landing page
location = / {
  default_type text/html;
  return 200 '
<!doctype html>
<html>
<head><meta charset="utf-8"><title>nginx Container</title></head>
<body>
  <h1>nginx from $host</h1>
  <ul>
    <li><a href="/files/">Files Example</a></li>
    <li><a href="/proxy">Proxy Example</a></li>
    <li><a href="/webdav/">WebDAV Example</a></li>
  </ul>
</body>
</html>';
}

# Files area
# Redirect "/files" -> "/files/"
location = /files { return 301 /files/; }

location /files/ {
  alias /var/lib/nginx/html/files/;  # keep trailing slash
  index index.html;
}

