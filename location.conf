#     <li><a href="/webdav/">WebDAV</a></li>   
#     </ul>
# </body>
# </html>';



  
  add_header Content-Type text/plain;
  add_header DAV "1,2" always;
  add_header MS-Author-Via "DAV" always;
  
  alias /mnt/volumes/data;                 # same storage as /webdav/
  autoindex on;
  
  dav_methods PUT DELETE MKCOL COPY MOVE;
  dav_ext_methods PROPFIND OPTIONS LOCK UNLOCK;
  dav_ext_lock zone=davlocks;
  create_full_put_path on;
  dav_access user:rw group:rw all:r;
  
  client_max_body_size 5m;

}

# Simple static content example

# Redirect "/static" -> "/static/"
location = /static{ return 301 /static/; }

location /static/ {
  alias /var/lib/nginx/html/static/;  # keep trailing slash
  index index.html;
}

# Proxy example

# Redirect "/proxy" -> "/proxy/"
location = /proxy{ return 301 /proxy/; }

location /proxy/ {
  proxy_pass https://example.com/;  # Change to the external HTTPS server
  proxy_set_header Host example.com;  # Set the Host header to the external server
  proxy_set_header X-Real-IP $remote_addr;  # Forward the real client IP
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Forward the X-Forwarded-For header
  proxy_set_header X-Forwarded-Proto $scheme;  # Forward the original protocol
  
  # Rewrite URLs in the content
  sub_filter 'href="/' 'href="https://$host:8443/';  # Rewrite href attributes
  sub_filter 'src="/' 'src="http://$host:8443/';  # Rewrite src attributes
  sub_filter_once off;  # Apply the rewrite to all occurrences
}

# Enforce trailing slash for directory semantics (most DAV clients cope better)

# Redirect "/webdav" -> "/webdav/"
location = /webdav { return 301 /webdav/; }

# Minimal probe to prove this file is active (hit /webdav/ with GET)
# location = /webdav/ {
#   add_header X-WebDAV-Exact "yes" always;
#   add_header Allow "OPTIONS, PROPFIND, GET, HEAD, PUT, DELETE, MKCOL, COPY, MOVE, LOCK, UNLOCK" always;
#   return 204;
# }

# Real WebDAV handler
location /webdav/ {
  # Prove we’re in the right block
  add_header X-WebDAV-Location "active" always;

  # **Short-circuit OPTIONS** so nginx never falls through to 405
  if ($request_method = OPTIONS) {
    add_header Allow "OPTIONS, PROPFIND, GET, HEAD, PUT, DELETE, MKCOL, COPY, MOVE, LOCK, UNLOCK" always;
    return 204;
  }

  alias /mnt/volumes/data/;           # trailing slash required
  autoindex on;
  add_header DAV "1,2" always;

  # Core DAV
  dav_methods           PUT DELETE MKCOL COPY MOVE;
  create_full_put_path  on;
  dav_access            user:rw group:r all:r;

  # Extra DAV (dav_ext)
  dav_ext_methods       PROPFIND OPTIONS LOCK UNLOCK;

  # REQUIRED: bind this location to the shared lock zone
  dav_ext_lock          zone=davlocks;

  # Optional CORS (uncomment for browser apps)
  # add_header Access-Control-Allow-Origin * always;
  # add_header Access-Control-Allow-Headers Depth, Destination, Overwrite, Authorization, Content-Type, X-Requested-With, Range always;
  # add_header Access-Control-Expose-Headers ETag always;
}

