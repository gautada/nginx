# Example of inline static content
  location = / {
    default_type text/html;     # set Content-Type
    return 200 '
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>nginx Container</title>
</head>
<body>
  <h1>nginx from $host</h1>
  <ul>
   <li>
    <a href="/files">Files Example</a>
   </li>
  <li>
    <a href="/proxy">Proxy Example</a>
   </li>
   <li>
    <a href="/webdav">WebDAV Example</a>
</body>
</html>';
}
